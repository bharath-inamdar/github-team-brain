services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://127.0.0.1:8000/api/v1}"
    container_name: gtb-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: gtb-api
    environment:
      APP_NAME: "${APP_NAME:-GitHub Team Brain API}"
      APP_VERSION: "${APP_VERSION:-1.0.0}"
      DEBUG: "${DEBUG:-False}"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/github_team_brain
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_REQUEST_TIMEOUT_SECONDS: "${GITHUB_REQUEST_TIMEOUT_SECONDS:-15}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      GEMINI_MODEL: "${GEMINI_MODEL:-models/gemini-3.6-flash}"
      GEMINI_EMBEDDING_MODEL: "${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}"
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_COLLECTION_NAME: "${CHROMA_COLLECTION_NAME:-teambrain}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-60}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-admin@teambrain.local}"
      BOOTSTRAP_ADMIN_USERNAME: "${BOOTSTRAP_ADMIN_USERNAME:-admin}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - chromadb
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: gtb-postgres
    environment:
      POSTGRES_DB: github_team_brain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: gtb-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
